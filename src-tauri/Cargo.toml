[package]
name = "tkfmap"
version = "0.1.0"
description = "Escape from Tarkov SVG Map Position Tracker"
authors = ["TarkovMap"]
edition = "2021"
default-run = "tkfmap"

[lib]
name = "tkfmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
regex = "1"
dirs = "6"
iroh = "1.5"
pkarr = "5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
sha2 = "0.10"
rand = "0.9"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
