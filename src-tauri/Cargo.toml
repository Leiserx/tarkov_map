[package]
name = "tkfmap"
version = "0.1.0"
description = "Escape from Tarkov SVG Map Position Tracker"
authors = ["TarkovMap"]
edition = "2021"

[lib]
name = "tkfmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
regex = "1"
dirs = "6"
